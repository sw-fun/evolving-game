# The castle's pieces, made by X_eTaL driving Blender (assets/Castle.xtl,
# assets/castle-assets.xtl; just assets). Do not edit: it is written.
title = "Evolving Game: the castle's pieces"
library = "assets/Castle.xtl"
license = "MIT"
blender = "Blender 5.1.2"
format = "glTF 2.0, binary (.glb)"
units = "meters: one tile is 1 by 1; the origin at the middle of the base, on the ground"
up = "+Y in glTF (+Z in Blender)"
front = "+Z in glTF (-Y in Blender)"
clip-rate = 30
preview = "PIECE.png: 256 by 256, RGBA, transparent, every piece at one scale"
most-bytes = 262144

