# The castle: every venue of the game (a game, a level, a place), where
# it is on the realm's map, what makes it known and what it needs. Read
# by Atlas.xtl (the map) and Sketch.xtl (a venue not built yet) through
# lib/Mode; every value is a string, or a list of strings. To add a
# game: add a venue here (and, when it is built, its kind and scenario
# in place of "placeholder").
mode = ["map"]
title = ["The castle"]

# Where: the castle's zones (a path from this file) and the zone whose
# map the venues are shown on.
zones = ["../../world/zones.toml"]
zone = ["realm"]
# Every venue is placed on the near side of the wall (the places inside
# the castle at the wall's foot), so the village behind it is seen
# whole.
# What stands behind the wall: the village, made from a seed, so many
# tiles wide and deep (lib/Village). The same line in every scenario
# is the same village.
village = ["seed 7", "wide 34", "deep 20"]

time = ["10.5"]

# The venues, in the order of their numbers on the map.
venues = ["bridge-1", "on-foot", "bridge-2", "camp", "town", "bridge-3", "engineer", "commander", "crossing", "gate-maze", "rune-keep", "tactics", "dungeon", "ray-maze", "treasury", "automata", "hall"]
venue-fields = ["title", "kind", "scenario", "row", "column", "from", "needs", "marker", "about"]

# Deeds: quests (known from the start, so you know what to try) and
# achievements (hidden until earned). Each is achieved when every name
# it needs (names of the world state, a space between) is at least its
# least; achieving it brings its experience (xp). They are shown in the
# hall of deeds.
deeds = ["season-summer", "every-season", "way-in", "cross", "inside", "first-win", "purse", "veteran", "wanderer", "cartographer", "breached"]
deed-fields = ["title", "kind", "needs", "least", "xp", "about"]

# A venue: its title; its kind (the mode that plays it: defense, roam,
# board for the hall of deeds, or placeholder for one not built yet) and
# its scenario (a path from
# this file; none for a placeholder); its row and column on the realm's
# map; from, the venue whose winning makes it known ("" for one known
# from the start); needs, a name in the world state that must be set
# for it to be entered ("" for none); marker, the piece that stands for
# it on the map; and what it is about.

