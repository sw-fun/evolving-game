# The level maps: the road of levels each side plays, in order. Read
# by Roads.xtl through lib/Mode; every value is a string, or a list of
# strings. The first two places of a road are open from the start;
# every next one opens when one of the two before it is won (the
# world's venue.ID.done), and what its entry needs is set. To add a level: add its venue in castle.toml, then
# its id to a road here and its entry below.
mode = ["roads"]
title = ["The roads"]

# Where: the castle's zones (a path from this file) and the zone the
# stage is made from.
zones = ["../../world/zones.toml"]
zone = ["realm"]

# The castle's venues (a path from this file): a road names its places
# by their ids there.
castle = ["castle.toml"]

# The roads, a list of venue ids each, in the order they are played:
# the tutorial first, the hard ones last.
defend = ["bridge-1", "bridge-2", "bridge-3", "hill-fort", "troll", "crossing", "city", "gate-maze", "dungeon", "ray-maze", "treasury"]
attack = ["camp", "bridge-attack-1", "bridge-attack-2", "on-foot", "fields", "troll", "crossing", "city", "gate-maze", "dungeon", "ray-maze", "warchest"]

# An entry of a road (a table defend-level.ID or attack-level.ID, ID
# the venue's id): its label (short: it is written under its circle),
# its tier (tutorial, easy, normal or hard), and coming: "yes" where the
# attacker's version is not built yet (the defender's is played then),
# "no" (or nothing) where it is; needs (may be left out): what else
# must be so for it to open, a space between: a name of the world set
# above 0 (fact.troll-way, the way past the bridge troll), or the id of
# an earlier level of the road, won; and why, what a level locked by
# its needs says opens it ("pass the troll": "locked, pass the troll
# first"; short, for it is written under its circle), wanted with
# needs.
entry-fields = ["label", "tier", "coming", "needs", "why"]

[defend-level.bridge-1]
label = "Summer bridge"
tier = "tutorial"
coming = "no"

[defend-level.bridge-2]
label = "Snow bridge"
tier = "easy"
coming = "no"

[defend-level.bridge-3]
label = "Storm bridge"
tier = "normal"
