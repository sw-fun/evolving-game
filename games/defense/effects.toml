# What the difficulty chosen and the character's calling do to a level
# of Castle Defense. Read by Defending.xtl through lib/Mode when a
# scenario names this file (effects = ["effects.toml"]); every value is
# a string. A scenario that names no effects file is played as written.
#
# The difficulty is the world's session.level (1 Novice ... 5
# Impossible; none chosen plays as Normal); the calling is the world's
# character.calling, in the order of games/castle/front.toml's callings
# (none chosen: no bonus).
levels = ["novice", "easy", "normal", "hard", "impossible"]
callings = ["soldier", "merchant", "spy", "thief", "witch", "engineer", "herald"]

# An effect: what the starting gold is multiplied by, the lives added
# (a level never starts with fewer than 1), and what the towers' costs,
# the towers' damage and the enemies' hit points are multiplied by. A
# level's and a calling's effects are combined: the multipliers
# multiplied, the lives added.
effect-fields = ["name", "gold", "lives", "cost", "damage", "hp"]

# Novice: "you cannot lose": lives to spare and weak enemies.
[level.novice]
name = "Novice"
gold = "1.5"
lives = "90"
cost = "1.0"
damage = "1.0"
hp = "0.5"

[level.easy]
name = "Easy"
gold = "1.25"
lives = "5"
cost = "1.0"
damage = "1.0"
hp = "0.8"

[level.normal]
name = "Normal"
gold = "1.0"
lives = "0"
cost = "1.0"
damage = "1.0"
hp = "1.0"

[level.hard]
name = "Hard"
gold = "0.85"
lives = "-3"
cost = "1.0"
damage = "1.0"
hp = "1.3"

[level.impossible]
name = "Impossible"
gold = "0.7"
lives = "-7"
cost = "1.0"
damage = "1.0"
hp = "1.7"

# Soldier: "towers hit harder; troops are tougher".
[calling.soldier]
name = "Soldier"
gold = "1.0"
lives = "2"
cost = "1.0"
damage = "1.2"
hp = "1.0"

# Merchant: "things cost less".
[calling.merchant]
name = "Merchant"
gold = "1.2"
lives = "0"
cost = "0.9"
damage = "1.0"
hp = "1.0"

# Spy: "patrols are seen sooner": the enemy comes softened.
[calling.spy]
name = "Spy"
gold = "1.0"
lives = "0"
cost = "1.0"
damage = "1.0"
hp = "0.95"

# Thief: "more gold": a richer start.
[calling.thief]
name = "Thief"
gold = "1.3"
lives = "0"
cost = "1.0"
damage = "1.0"
hp = "1.0"

# Witch or warlock: "ice and fire are stronger".
[calling.witch]
name = "Witch/Warlock"
gold = "1.0"
lives = "0"
cost = "1.0"
damage = "1.15"
hp = "1.0"

# Engineer: "towers and engines are cheaper to build".
[calling.engineer]
name = "Engineer"
gold = "1.0"
lives = "0"
cost = "0.8"
damage = "1.0"
hp = "1.0"

# Herald: "allies come sooner": a life more.
[calling.herald]
name = "Herald"
gold = "1.0"
lives = "1"
cost = "1.0"
damage = "1.0"
hp = "1.0"
