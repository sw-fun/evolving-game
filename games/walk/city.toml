# The city inside the gate, on foot: the village of seed 7 (the one seen
# behind the wall), stood on its own ground ("south 21": its wall line
# is this map's south edge), walked from the gate to the keep's door.
# The battlefield on foot: you walk it yourself, looking through your
# own eyes, from the entrance to the castle gate. Read by Roaming.xtl
# through lib/Mode; every value is a list of strings.
mode = ["roam"]
# You start deep in the maze (at the street farthest from the keep's
# door, by a house) and find the way to the keep.
start = ["far"]
# What to find, said under the picture.
goal = ["Find the way through the streets to the keep's door."]
# The painting shown on the card before it (in the castle; the page
# serves docs/images under art/): the keep painting.
art = ["art/block-castle-keep.jpg"]
title = ["The city on foot"]

# Where: the castle's zones (a path from this file) and the zone.
zones = ["../../world/zones.toml"]
zone = ["city"]

# What stands behind the wall: the village, made from a seed, so many
# tiles wide and deep (lib/Village). The same line in every scenario
# is the same village.
village = ["seed 7", "wide 35", "deep 21", "south 21"]

# The hour of the day, 0 to 24 (lib/Sky).
time = ["14.5"]

# The weather: snow, and how thick it falls from 0 to 1.
weather = ["snow 0.0"]

# How fast you walk, in tiles a second (Shift doubles it), and how fast
# the arrow keys turn you, in degrees a second.
speed = ["2.5"]
turn = ["100"]

# Won when you stand in the gate.
win = ["gate"]
loss = ["never"]
reward = ["gold 1"]
